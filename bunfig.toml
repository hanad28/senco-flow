[install]
# 7-day supply-chain guard: skip package versions published less than 7 days ago.
# Unit is seconds (604800 = 7d). update-agents skill temporarily disables the
# *user* barrier (~/.bunfig.toml / ~/.npmrc), not this project file.
minimumReleaseAge = 604800
# Each entry bypasses the age guard for one package — confirm with the user
# before adding any.
minimumReleaseAgeExcludes = ["@lovable.dev/vite-tanstack-config", "@lovable.dev/mcp-js", "@lovable.dev/vite-plugin-dev-server-bridge", "@lovable.dev/vite-plugin-hmr-gate", "@lovable.dev/email-js", "@lovable.dev/webhooks-js"]
